---
layout: default
---
{% if page.external_url %}
<meta http-equiv="refresh" content="0; url={{ page.external_url }}">
<p>Redirecting to <a href="{{ page.external_url }}">{{ page.external_url }}</a>&hellip;</p>
{% else %}
<article>
  <h1>{{ page.title }}</h1>
  <p class="page-meta">
    <span class="tag tag-project">Project</span>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %Y" }}</time>
    {% if page.links %}
      {% for link in page.links %} · <a href="{{ link.url }}">{{ link.name }}</a>{% endfor %}
    {% endif %}
  </p>
  {{ content }}
</article>
{% endif %}
